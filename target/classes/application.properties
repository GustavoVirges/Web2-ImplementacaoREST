spring.application.name=jogadores-api

# Banco (createDatabaseIfNotExist cria o schema se ele não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/jogadores?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate cria/atualiza as tabelas (use validate ou none em produção)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# A sessão do JPA termina no fim da camada de serviço
spring.jpa.open-in-view=false
